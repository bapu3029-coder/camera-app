<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--dim:#a1a1a6;--ac:#ffd60a;--rec:#ff453a;--glass:rgba(44,44,46,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.3 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding:6px 8px 8px}
#top{display:flex;justify-content:space-between;gap:6px}
#top button{flex:1;height:36px;border-radius:18px;background:var(--glass);font-weight:600;font-size:13px}
#top .on,.chips .on{color:var(--ac)}
#vf{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;background:#111}
#stage{position:absolute;inset:0;overflow:hidden}
.sq #stage{inset:auto;left:0;right:0;top:50%;transform:translateY(-50%);aspect-ratio:1}
#v{width:100%;height:100%;object-fit:cover;display:block;transition:transform .12s}
#pb{position:absolute;inset:0;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,transparent 28%,#000 78%);mask-image:radial-gradient(ellipse at 50% 45%,transparent 28%,#000 78%);pointer-events:none}
#grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(90deg,#fff5 1px,transparent 1px),linear-gradient(#fff5 1px,transparent 1px);background-size:33.333% 100%,100% 33.333%}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:var(--dim);font-size:15px}
#fx{position:absolute;width:70px;height:70px;border:1.5px solid var(--ac);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#fx.go{animation:fx 1.4s ease-out}
@keyframes fx{0%{opacity:1;scale:1.4}15%{scale:1}80%{opacity:1}100%{opacity:0}}
#ex{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:16px;background:var(--glass);opacity:0;pointer-events:none;transition:opacity .2s}
#ex.show{opacity:1;pointer-events:auto}
#exr{flex:1;accent-color:var(--ac)}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:200;pointer-events:none;text-shadow:0 2px 20px #0008}
#rec{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:4px 12px;border-radius:12px;background:var(--rec);font-weight:600;font-variant-numeric:tabular-nums}
#zm{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:22px;background:var(--glass)}
#zm button{width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:600}
#zm .on{background:#0008;color:var(--ac)}
#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;padding:7px 14px;border-radius:16px;background:var(--glass);font-weight:500}
#modes{justify-content:center;gap:2px}
#modes button{background:none;color:var(--dim);font-weight:600;padding:6px 11px}
#modes .on{color:var(--ac)}
#bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:84px}
#th{width:52px;height:52px;border-radius:10px;background:#1c1c1e center/cover;border:1.5px solid #fff5;justify-self:start;font-size:18px}
#fp{width:52px;height:52px;border-radius:50%;background:var(--glass);font-size:22px;justify-self:end}
#sh{width:76px;height:76px;border-radius:50%;border:4px solid #fff;padding:4px}
#sh i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:.15s}
#sh.vid i{background:var(--rec)}
#sh.live i{border-radius:10px;transform:scale(.55)}
#sh:active i{transform:scale(.9)}
#gal{position:fixed;inset:0;z-index:9;background:#000;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 24px}
#gal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#gal h2{margin:0;font-size:20px}
#gal p{margin:0 0 12px;color:var(--dim)}
#gl{display:flex;flex-direction:column;gap:10px}
#gl img,#gl video{width:100%;border-radius:12px;user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button id="bFl">⚡ Flash</button><button id="bHdr">HDR</button><button id="bTm">⏱ Off</button><button id="bGr">Grid</button><button id="bSt">Styles</button>
  </div>
  <div id="vf">
    <div id="stage"><video id="v" playsinline muted autoplay></video><div id="pb" hidden></div><div id="grid" hidden></div></div>
    <div id="msg" hidden>Camera nahi khul paya. Browser me camera permission allow karo, ya is link ko seedha browser me kholo.</div>
    <div id="fx"></div>
    <div id="ex"><span>☀</span><input id="exr" type="range" min="-2" max="2" step=".1" value="0" aria-label="Exposure"></div>
    <div id="cd" hidden></div><div id="rec" hidden></div>
    <div id="zm"></div>
    <div id="fl"></div>
  </div>
  <div id="sty" class="chips" hidden></div>
  <div id="modes" class="chips"></div>
  <div id="bot"><button id="th" aria-label="Gallery"></button><button id="sh" aria-label="Shutter"><i></i></button><button id="fp" aria-label="Flip camera">⟲</button></div>
</div>
<div id="gal" hidden>
  <header><h2>Gallery</h2><button id="gx" class="chips" style="font-size:16px;padding:8px 14px;border-radius:16px;background:var(--glass)">Close</button></header>
  <p id="gp">Photo ko long-press karke “Save to Photos” chuno.</p>
  <div id="gl"></div>
</div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const v=$('v'),st=$('stage'),sh=$('sh');
const S={mode:'Photo',zoom:1,front:false,tm:0,grid:false,hdr:false,fl:false,sty:'Standard',ex:0};
const MODES=['Photo','Portrait','Square','Night','Video'];
const STY={Standard:{},Vivid:{c:1.12,s:1.5},Warm:{s:1.2,sp:.3,b:1.03},Noir:{g:1,c:1.25},Dramatic:{c:1.35,s:.8,b:.92},Fade:{c:.85,b:1.1,s:.8}};
let stream,track,caps={},rec,chunks,tick,items=[],et;

function F(){const a=STY[S.sty],f={b:(a.b||1)*(1+S.ex*.25),c:a.c||1,s:a.s||1,g:a.g||0,sp:a.sp||0};
  if(S.hdr){f.c*=1.08;f.s*=1.1}
  if(S.mode=='Night'){f.b*=1.35;f.c*=1.08}
  return f}

function mk(box,txt,key,fn){const b=document.createElement('button');b.textContent=txt;b.dataset.k=key;b.onclick=fn;$(box).append(b)}
MODES.forEach(m=>mk('modes',m,m,()=>{S.mode=m;if(rec&&rec.state=='recording')rec.stop();ui()}));
[1,2,3,5].forEach(z=>mk('zm',z+'×',z,()=>{S.zoom=z;ui()}));
Object.keys(STY).forEach(s=>mk('sty',s,s,()=>{S.sty=s;ui()}));

function ui(){
  const f=F();
  v.style.filter=`brightness(${f.b}) contrast(${f.c}) saturate(${f.s}) grayscale(${f.g}) sepia(${f.sp})`;
  v.style.transform=`scale(${S.front?-S.zoom:S.zoom},${S.zoom})`;
  $('bFl').classList.toggle('on',S.fl);$('bHdr').classList.toggle('on',S.hdr);
  $('bTm').textContent='⏱ '+(S.tm?S.tm+'s':'Off');$('bTm').classList.toggle('on',!!S.tm);
  $('bGr').classList.toggle('on',S.grid);$('grid').hidden=!S.grid;
  document.body.classList.toggle('sq',S.mode=='Square');
  $('pb').hidden=S.mode!='Portrait';
  sh.className=S.mode=='Video'?(rec&&rec.state=='recording'?'vid live':'vid'):'';
  for(const [box,cur] of [['modes',S.mode],['sty',S.sty]])for(const b of $(box).children)b.classList.toggle('on',b.dataset.k==cur);
  for(const b of $('zm').children)b.classList.toggle('on',Math.abs(+b.dataset.k-S.zoom)<.05);
}
$('bFl').onclick=()=>{S.fl=!S.fl;ui()};
$('bHdr').onclick=()=>{S.hdr=!S.hdr;ui()};
$('bTm').onclick=()=>{S.tm=S.tm==0?3:S.tm==3?10:0;ui()};
$('bGr').onclick=()=>{S.grid=!S.grid;ui()};
$('bSt').onclick=()=>{$('sty').hidden=!$('sty').hidden};
$('fp').onclick=()=>{S.front=!S.front;start()};
$('exr').oninput=e=>{S.ex=+e.target.value;ui();clearTimeout(et);et=setTimeout(()=>$('ex').classList.remove('show'),3500)};

st.onclick=e=>{const r=$('vf').getBoundingClientRect(),x=$('fx');
  x.style.left=e.clientX-r.left+'px';x.style.top=e.clientY-r.top+'px';
  x.classList.remove('go');void x.offsetWidth;x.classList.add('go');
  $('ex').classList.add('show');clearTimeout(et);et=setTimeout(()=>$('ex').classList.remove('show'),3500)};
let d0,z0;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
st.addEventListener('touchstart',e=>{if(e.touches.length==2){d0=dist(e);z0=S.zoom}},{passive:true});
st.addEventListener('touchmove',e=>{if(e.touches.length==2){S.zoom=Math.min(10,Math.max(1,z0*dist(e)/d0));ui()}},{passive:true});

async function start(){
  if(rec&&rec.state=='recording')rec.stop();
  stream&&stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.front?'user':{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}}});
    v.srcObject=stream;await v.play().catch(()=>{});
    track=stream.getVideoTracks()[0];caps=track.getCapabilities?track.getCapabilities():{};
    $('msg').hidden=true;
  }catch(e){$('msg').hidden=false}
  ui();
}

function snap(){
  const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  const ar=st.clientWidth/st.clientHeight;
  let cw=vw,ch=vw/ar;if(ch>vh){ch=vh;cw=vh*ar}
  cw/=S.zoom;ch/=S.zoom;
  const c=document.createElement('canvas');c.width=Math.round(cw);c.height=Math.round(ch);
  const x=c.getContext('2d');
  if(S.front){x.translate(c.width,0);x.scale(-1,1)}
  x.drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,c.width,c.height);
  x.setTransform(1,0,0,1,0,0);
  if(S.mode=='Portrait')portrait(c);
  grade(c);
  return c;
}
function portrait(c){
  const w=c.width,h=c.height,mkc=(a,b)=>{const k=document.createElement('canvas');k.width=a;k.height=b;return k};
  const s=mkc(w/10|0,h/10|0);s.getContext('2d').drawImage(c,0,0,s.width,s.height);
  const bl=mkc(w,h),bx=bl.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(s,0,0,w,h);
  const m=mkc(w,h),mx=m.getContext('2d');mx.drawImage(c,0,0);
  const g=mx.createRadialGradient(w/2,h*.45,Math.min(w,h)*.18,w/2,h*.45,Math.max(w,h)*.5);
  g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');
  mx.globalCompositeOperation='destination-in';mx.fillStyle=g;mx.fillRect(0,0,w,h);
  const x=c.getContext('2d');x.drawImage(bl,0,0);x.drawImage(m,0,0);
}
function grade(c){
  const f=F();if(f.b==1&&f.c==1&&f.s==1&&!f.g&&!f.sp)return;
  const x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),p=d.data,sat=f.s*(1-f.g);
  for(let i=0;i<p.length;i+=4){
    let r=p[i]*f.b,g=p[i+1]*f.b,b=p[i+2]*f.b;
    r=(r-128)*f.c+128;g=(g-128)*f.c+128;b=(b-128)*f.c+128;
    const l=.299*r+.587*g+.114*b;
    r=l+(r-l)*sat;g=l+(g-l)*sat;b=l+(b-l)*sat;
    if(f.sp){const R=.393*r+.769*g+.189*b,G=.349*r+.686*g+.168*b,B=.272*r+.534*g+.131*b;r+=(R-r)*f.sp;g+=(G-g)*f.sp;b+=(B-b)*f.sp}
    p[i]=r;p[i+1]=g;p[i+2]=b;
  }
  x.putImageData(d,0,0);
}
function add(type,url){
  items.unshift({type,url});
  $('th').style.backgroundImage=type=='img'?`url(${url})`:'none';
  $('th').textContent=type=='img'?'':'▶';
}
function shoot(){
  const c=snap();if(!c)return;
  c.toBlob(b=>add('img',URL.createObjectURL(b)),'image/jpeg',.92);
  navigator.vibrate&&navigator.vibrate(15);
  st.animate([{opacity:.25},{opacity:1}],160);
}
async function fire(){
  const torch=S.fl&&!S.front&&caps.torch;
  if(S.fl){if(torch){await track.applyConstraints({advanced:[{torch:true}]});await sleep(300)}else{$('fl').style.opacity=1;await sleep(250)}}
  shoot();
  if(S.fl){$('fl').style.opacity=0;if(torch)track.applyConstraints({advanced:[{torch:false}]}).catch(()=>{})}
}
async function go(){
  for(let i=S.tm;i>0;i--){$('cd').textContent=i;$('cd').hidden=false;await sleep(1000)}
  $('cd').hidden=true;await fire();
}
async function toggleRec(){
  if(rec&&rec.state=='recording'){rec.stop();return}
  const mt=['video/mp4','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mt){$('rec').textContent='Video recording is browser me supported nahi';$('rec').hidden=false;setTimeout(()=>$('rec').hidden=true,2500);return}
  let s=stream;
  try{const a=await navigator.mediaDevices.getUserMedia({audio:true});s=new MediaStream([...stream.getVideoTracks(),...a.getAudioTracks()])}catch(e){}
  chunks=[];rec=new MediaRecorder(s,{mimeType:mt});
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{clearInterval(tick);$('rec').hidden=true;s.getAudioTracks().forEach(t=>t.stop());add('vid',URL.createObjectURL(new Blob(chunks,{type:mt})));ui()};
  rec.start();const t0=Date.now();$('rec').hidden=false;
  tick=setInterval(()=>{const t=(Date.now()-t0)/1000|0;$('rec').textContent='● '+String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},300);
  ui();
}

let hold,bt,bn=0,swallow=false;
const endB=()=>{clearTimeout(hold);clearInterval(bt);if(swallow)$('rec').hidden=true};
sh.onpointerdown=()=>{swallow=false;if(S.mode=='Video'||S.tm)return;
  hold=setTimeout(()=>{swallow=true;bn=0;bt=setInterval(()=>{if(bn>=20)return endB();shoot();$('rec').textContent='Burst '+(++bn);$('rec').hidden=false},120)},450)};
sh.onpointerup=sh.onpointercancel=endB;
sh.onclick=()=>{if(swallow){swallow=false;return}S.mode=='Video'?toggleRec():go()};

$('th').onclick=()=>{
  const gl=$('gl');gl.innerHTML='';
  items.forEach(i=>{const e=document.createElement(i.type=='img'?'img':'video');e.src=i.url;if(i.type=='vid'){e.controls=true;e.playsInline=true}gl.append(e)});
  $('gp').textContent=items.length?'Photo ko long-press karke “Save to Photos” chuno.':'Abhi koi photo ya video nahi hai. Shutter dabao.';
  $('gal').hidden=false;
};
$('gx').onclick=()=>{$('gal').hidden=true};

ui();start();
</script>
</body>
</html>
